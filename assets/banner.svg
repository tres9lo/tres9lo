<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Bikorimana Ange Tresor — full-stack engineer and founder of Glaun Studio, Kigali, Rwanda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="1085" cy="180" rx="360" ry="300" fill="url(#glow)"/>

  <g fill="none" stroke="#22D3EE" stroke-opacity="0.20" stroke-width="1.4">
    <circle cx="1085" cy="180" r="86"/>
    <circle cx="1085" cy="180" r="140"/>
    <circle cx="1085" cy="180" r="200"/>
  </g>
  <circle cx="1085" cy="180" r="7" fill="#22D3EE"/>
  <circle cx="1085" cy="94" r="5" fill="#C9A227" fill-opacity="0.9"/>

  <rect x="1236" y="164" width="32" height="32" rx="9" fill="url(#accent)" fill-opacity="0.95"/>
  <text x="1252" y="186" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#070B14">BT</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="12.5" font-weight="600" letter-spacing="3.4" fill="#22D3EE">KIGALI, RWANDA &#183; AVAILABLE FOR PROJECTS</text>

    <text x="72" y="162" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#F8FAFC">Bikorimana Ange Tresor</text>

    <text x="72" y="202" font-size="19" font-weight="400" fill="#94A3B8">Full-stack engineer &#183; Founder of Glaun Studio</text>

    <rect x="72" y="232" width="72" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="72" y="278" font-size="15" font-weight="400" fill="#64748B">Most of my work is private. This is the part you can see.</text>
    <text x="72" y="304" font-size="15" font-weight="400" fill="#64748B">Local-first software, shipped from Kigali to anywhere.</text>
  </g>
</svg>
